version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: farmhelp_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    restart: always

  frontend:
    build:
      context: ./frontendweb
      dockerfile: Dockerfile
    container_name: farmhelp_frontend
    ports:
      - "3000:3000"
    env_file:
      - ./frontendweb/.env
    depends_on:
      - backend
    restart: always
